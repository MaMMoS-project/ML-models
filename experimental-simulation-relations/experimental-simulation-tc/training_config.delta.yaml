# ============================================================================
# experimental-simulation-tc — DELTA-LEARNING experiment configuration
# ============================================================================
# Selected via  --config training_config.delta.yaml  (see run_1node-RE-delta-learning.sh).
# This is the old `--delta-learning --re-features --cv 5` run, now expressed as a
# config file. Everything else matches training_config.yaml.
# ----------------------------------------------------------------------------

# Train on the correction (Tc_exp - Tc_sim) instead of Tc_exp directly.
delta_learning: true

# Rare-earth physics features ON (helps the RE split).
re_features: true

# 5-fold CV for the headline metrics (the RE split is small and single-split noisy).
cv: 5

# CURRENT SETTING: ALL FIVE families enabled (the default, same as training_config.yaml) —
# a run produces the full comparison. On the curated delta run the families are a near-tie
# (top-5 within ~0.01 R2) and the best family depends on the split (RF for All-Pairs, Ridge
# for RE-Pairs, LightGBM for RE-Free-Pairs). For faster turnaround, disable the two slow
# families (sr + mlp) and keep the fast trio linear + rf + lgbm, at a negligible accuracy cost.
# Augmented-data note: every family's CV is now computed LEAKAGE-FREE
# (base_trainer.leakage_free_cv), so re-enabling the slow families gives trustworthy
# augmented numbers too. Requirements: MLP needs PyTorch (already in the venv); SR needs
# the `pysr` package + its Julia backend pre-installed on a login node (see README).
models:
  sr:
    enabled: true       # Symbolic Regression (PySR) — slowest; needs pysr + Julia backend
  linear:
    enabled: true       # fast; ~ties MLP for #3/#4
  rf:
    enabled: true       # fast; top-3
  lgbm:
    enabled: true       # fast; best on RE-Free-Pairs
  mlp:
    enabled: true       # FCNN / PyTorch MLP — slow (epochs); needs torch (already present)
